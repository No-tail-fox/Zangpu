name: zangpu-api-control-plane

x-backend-service: &backend-service
  build:
    context: ..
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  environment:
    ZANGPU_ENVIRONMENT: production
    ZANGPU_SERVICE_VERSION: 0.1.0
    ZANGPU_DATABASE_URL: postgresql+psycopg://control:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/control
    ZANGPU_REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
    ZANGPU_BIFROST_BASE_URL: http://bifrost:8080
    ZANGPU_BIFROST_MANAGEMENT_TOKEN: ${BIFROST_MANAGEMENT_TOKEN:?Set BIFROST_MANAGEMENT_TOKEN}
    ZANGPU_BIFROST_EXPECTED_VERSION: ${BIFROST_EXPECTED_VERSION:?Set BIFROST_EXPECTED_VERSION}
    ZANGPU_OPENWEBUI_INTERNAL_BASE_URL: ${OPENWEBUI_INTERNAL_BASE_URL:?Set OPENWEBUI_INTERNAL_BASE_URL}
    ZANGPU_OPENWEBUI_INTERNAL_SERVICE_ID: ${OPENWEBUI_INTERNAL_SERVICE_ID:?Set OPENWEBUI_INTERNAL_SERVICE_ID}
    ZANGPU_OPENWEBUI_INTERNAL_SERVICE_SECRET: ${OPENWEBUI_INTERNAL_SERVICE_SECRET:?Set OPENWEBUI_INTERNAL_SERVICE_SECRET}
    ZANGPU_ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set ADMIN_SESSION_SECRET}
    ZANGPU_ADMIN_LOGIN_TOKEN: ${ADMIN_LOGIN_TOKEN:?Set ADMIN_LOGIN_TOKEN}
    ZANGPU_EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-180}
    ZANGPU_ADMIN_AUDIT_RETENTION_DAYS: ${ADMIN_AUDIT_RETENTION_DAYS:-730}
    ZANGPU_RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-1000}
    ZANGPU_API_CREDENTIAL_KEYS: ${API_CREDENTIAL_KEYS:?Set API_CREDENTIAL_KEYS}
    ZANGPU_API_CREDENTIAL_ACTIVE_KEY_ID: ${API_CREDENTIAL_ACTIVE_KEY_ID:?Set API_CREDENTIAL_ACTIVE_KEY_ID}
    ZANGPU_CONTRACT_API_MAX_OUTPUT_TOKENS: ${CONTRACT_API_MAX_OUTPUT_TOKENS:-4096}
    ZANGPU_MODEL_POOL_POLICIES: ${MODEL_POOL_POLICIES:?Set MODEL_POOL_POLICIES}
    ZANGPU_CONTRACT_API_GLOBAL_QUEUE_LIMIT: ${CONTRACT_API_GLOBAL_QUEUE_LIMIT:-200}
    ZANGPU_CONTRACT_API_CALLER_QUEUE_LIMIT: ${CONTRACT_API_CALLER_QUEUE_LIMIT:-8}
    ZANGPU_CONTRACT_API_QUEUE_WAIT_SECONDS: ${CONTRACT_API_QUEUE_WAIT_SECONDS:-30}
    ZANGPU_CONTRACT_API_QUEUE_POLL_MILLISECONDS: ${CONTRACT_API_QUEUE_POLL_MILLISECONDS:-250}
  expose:
    - "9000"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    bifrost:
      condition: service_started
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/api/v1/external/health', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 5
  networks:
    - private

services:
  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      backend-3:
        condition: service_healthy
      backend-4:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - target: 9000
        published: "${CALLER_PORT:-9000}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 9001
        published: "${ADMIN_PORT:-9001}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - edge
      - private

  backend-1: *backend-service
  backend-2: *backend-service
  backend-3: *backend-service
  backend-4: *backend-service

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private

  bifrost:
    image: ${BIFROST_IMAGE:?Set BIFROST_IMAGE to a license-verified pinned image digest}
    restart: unless-stopped
    command: ["-app-dir", "/app/data", "-host", "0.0.0.0", "-port", "8080"]
    environment:
      BIFROST_DISABLE_PROFILER: "1"
    expose:
      - "8080"
    volumes:
      - bifrost-data:/app/data
    networks:
      - private

  postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: control
      POSTGRES_USER: control
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control -d control"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private

  redis:
    image: valkey/valkey:8.1.3-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    networks:
      - private

networks:
  edge:
  private:

volumes:
  bifrost-data:
  postgres-data:
  redis-data:
